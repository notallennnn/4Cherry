<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>...</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0b0b0f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    flex-direction: column;
  }

  .btn {
    padding: 12px 18px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: white;
    color: black;
    font-weight: 600;
    transition: 0.2s;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  .flower {
    font-size: 0px;
    transition: all 1s ease;
    margin-top: 20px;
  }

  .message {
    opacity: 0;
    transform: translateY(10px);
    transition: 1s ease;
    margin-top: 20px;
    text-align: center;
    max-width: 280px;
    line-height: 1.4;
    color: #eaeaea;
  }

  .bloom {
    font-size: 90px !important;
  }

  .show {
    opacity: 1 !important;
    transform: translateY(0);
  }

  .hint {
    position: absolute;
    bottom: 20px;
    font-size: 12px;
    opacity: 0.4;
  }
</style>
</head>

<body>

<button class="btn" onclick="bloom()">click</button>

<div class="flower" id="flower">🌼</div>

<div class="message" id="msg">
  made this while taking a break.<br><br>
  hope your day is going okay.
</div>

<div class="hint">you crossed my mind</div>

<script>
function bloom() {
  document.getElementById("flower").classList.add("bloom");

  setTimeout(() => {
    document.getElementById("msg").classList.add("show");
  }, 600);
}
</script>

</body>
</html>
